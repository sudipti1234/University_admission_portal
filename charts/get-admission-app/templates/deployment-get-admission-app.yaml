apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.getAdmissionApp.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.getAdmissionApp.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.getAdmissionApp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.getAdmissionApp.name }}
      annotations:
        ad.datadoghq.com/{{ .Values.getAdmissionApp.name }}.logs: >-
          [{"source":"{{ .Values.getAdmissionApp.datadog.logsSource }}","service":"{{ .Values.getAdmissionApp.datadog.service1 }}"},
           {"source":"{{ .Values.getAdmissionApp.datadog.logsSource }}","service":"{{ .Values.getAdmissionApp.datadog.service2 }}"}]
    spec:
      containers:
        - name: {{ .Values.getAdmissionApp.name }}
          image: "{{ .Values.getAdmissionApp.image.repository }}:{{ .Values.getAdmissionApp.image.tag }}"
          ports:
            - containerPort: {{ .Values.getAdmissionApp.containerPort }}
          env:
            - name: MONGODB_URI
              value: "{{ .Values.getAdmissionApp.env.MONGODB_URI }}"
            - name: PORT
              value: "{{ .Values.getAdmissionApp.env.PORT }}"
            - name: HOST
              value: "{{ .Values.getAdmissionApp.env.HOST }}"
            - name: NODE_ENV
              value: "{{ .Values.getAdmissionApp.env.NODE_ENV }}"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "{{ .Values.getAdmissionApp.datadog.tracePort }}"
            - name: DD_ENV
              value: "{{ .Values.getAdmissionApp.datadog.env }}"
            - name: DD_SERVICE
              value: "{{ .Values.getAdmissionApp.datadog.service }}"
            - name: DD_VERSION
              value: "{{ .Values.getAdmissionApp.datadog.version }}"

